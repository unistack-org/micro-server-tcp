run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - bodyclose
    - gci
    - goconst
    - gocritic
    - gosimple
    - gofmt
    - gofumpt
    - goimports
    - gosec
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - unparam
  disable-all: false
